[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ews-mcp-v5"
version = "5.0.0a1"
description = "Greenfield EWS MCP server — 24 consolidated tools for an executive-mailbox agent-secretary (design/ews-mcp-fable-redo/IDEATION.md)"
requires-python = ">=3.11"
dependencies = [
    "exchangelib==5.0.3",
    "jsonschema>=4.21",
    "mcp>=1.27,<2",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "tzdata",  # zoneinfo source of truth: slim images/Windows ship no OS tzdb
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ewsmcp = "ewsmcp.main:main"

[tool.setuptools.packages.find]
include = ["ewsmcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100
